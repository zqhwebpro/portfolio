  <!-- ═══════════════════════════════════════════════════════════════════
       1. FULLSCREEN BACKGROUND VIDEO (https://youtu.be/-3HFs3Qu7Mc)
          Blue Streaks Abstract Shapes Geometric Moving Animated Loop
       ═══════════════════════════════════════════════════════════════════ -->
  <div class="os-video-background-layer" aria-hidden="true">
    <iframe
      id="osBackgroundVideoIframe"
      class="os-video-iframe"
      src="https://www.youtube.com/embed/-3HFs3Qu7Mc?autoplay=1&mute=1&loop=1&playlist=-3HFs3Qu7Mc&controls=0&showinfo=0&rel=0&iv_load_policy=3&disablekb=1&modestbranding=1&playsinline=1&enablejsapi=1"
      title="Background Geometric Stream (-3HFs3Qu7Mc)"
      frameborder="0"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
      tabindex="-1">
    </iframe>
  </div>

  <!-- Atmospheric Vignette Overlay (Dims video glare & focuses desktop content) -->
  <div class="os-video-vignette" aria-hidden="true"></div>

  <!-- ═══════════════════════════════════════════════════════════════════
       2. FOREGROUND OS WORKSPACE CONTAINER
       ═══════════════════════════════════════════════════════════════════ -->
  <div class="os-desktop-workspace">

    <!-- ═══════════════════════════════════════════════════════════════════
         3. TITANIUM GREY OS SYSTEM MENUBAR
         ═══════════════════════════════════════════════════════════════════ -->
    <header class="sticky top-0 z-40 px-3 sm:px-6 py-2.5 w-full">
      <div class="w-full os-system-menubar px-4 py-2 flex items-center justify-between gap-3">
        
        <!-- Left Terminal Icon Link (Home of the App) -->
        <div class="flex items-center">
          <a 
            href="./index.html" 
            class="w-8 h-8 rounded-lg bg-slate-800 border border-slate-700 flex items-center justify-center text-sky-400 hover:bg-slate-700 hover:border-slate-600 transition-colors shadow-xs" 
            title="App Home"
            aria-label="App Home">
            <i class="fa-solid fa-terminal text-xs"></i>
          </a>
        </div>

        <!-- Right Controls: Sound Icon to the Left & Live OS Clock -->
        <div class="flex items-center gap-2.5">
          <!-- Audio FX Toggle -->
          <button 
            id="osAudioToggleBtn" 
            type="button" 
            class="os-audio-toggle-btn w-8 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 flex items-center justify-center text-sky-400 text-xs transition-colors cursor-pointer"
            title="Toggle OS Audio Synthesizer"
            aria-label="Toggle OS Audio Synthesizer">
            <i class="fa-solid fa-volume-high"></i>
          </button>

          <!-- Live OS Clock -->
          <span id="osMenuClock" class="os-menu-clock font-mono text-xs text-slate-300 font-medium px-2.5 py-1 rounded bg-slate-900 border border-slate-800">
            Fri Oct 2, 3:00 PM
          </span>
        </div>

      </div>
    </header>

    <main class="w-full px-4 sm:px-8 lg:px-12 py-4 sm:py-6 pb-28 sm:pb-32">
      


      <!-- ═══════════════════════════════════════════════════════════════════
           6. TABBED WHITE CARD WORKBENCH (7 CORE TRACKS)
           ═══════════════════════════════════════════════════════════════════ -->
      <section aria-label="Curriculum Learning Modules">
        
        <!-- IDE File-Tabs Container (Rendered dynamically by matrix.js) -->
        <div class="flex items-center gap-1.5 overflow-x-auto pb-1 mb-0 scrollbar-none" id="osIdeTabsContainer">
          <!-- Rendered dynamically by matrix.js -->
        </div>

        <!-- Main Dynamic Content Area (Active Tabbed White Card or Grid of White Cards) -->
        <div id="osMainContentArea">
          <!-- Rendered dynamically by matrix.js -->
        </div>

      </section>

    </main>

    <!-- ═══════════════════════════════════════════════════════════════════
         7. FIXED BOTTOM OS SYSTEM MENUBAR
         ═══════════════════════════════════════════════════════════════════ -->

      <div class="w-full os-system-menubar px-4 py-2 flex items-center justify-between gap-3">
        
        <!-- Left Terminal Icon Link (Home of the App) -->
        <div class="flex items-center">
          <a 
            href="./index.html" 
            class="w-8 h-8 rounded-lg bg-slate-800 border border-slate-700 flex items-center justify-center text-sky-400 hover:bg-slate-700 hover:border-slate-600 transition-colors shadow-xs"

            aria-label="App Home">
            <i class="fa-solid fa-terminal text-xs"></i>
          </a>
        </div>

        <div class="flex items-center gap-2.5">
          <!-- Audio FX Toggle -->
          <button 
            type="button" 
            class="os-audio-toggle-btn w-8 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 flex items-center justify-center text-sky-400 text-xs transition-colors cursor-pointer"
            title="Toggle OS Audio Synthesizer"
            aria-label="Toggle OS Audio Synthesizer">
            <i class="fa-solid fa-volume-high"></i>

          <!-- Live OS Clock -->
          <span class="os-menu-clock font-mono text-xs text-slate-300 font-medium px-2.5 py-1 rounded bg-slate-900 border border-slate-800">
            Fri Oct 2, 3:00 PM
          </span>
        </div>

      </div>
    </footer>

  </div>

  <script src="./matrix.js"></script>
