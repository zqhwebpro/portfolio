    <style>
        :root {
            --amber: #F5A623;
            --red-orange: #E8442A;
            --text-light: #e8e8e8;
            --text-muted: #999;
            --bg-dark: #121212;
            --card-bg: #1c1c1c;
            --border-color: #2a2a2a;
        }

        body {
            background: var(--bg-dark);
            color: var(--text-light);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 2rem;
            margin: 0;
            min-height: 100vh;
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto 2.5rem auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
        }

        h1 {
            margin: 0;
            font-size: 2rem;
            color: var(--text-light);
        }

        .back-link {
            display: inline-block;
            padding: 0.5rem 1rem;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        .back-link:hover {
            color: var(--amber);
            border-color: var(--amber);
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 1.5rem;
            text-decoration: none;
            color: inherit;
            border: 1px solid var(--border-color);
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: var(--amber);
            box-shadow: 0 4px 20px rgba(245, 166, 35, 0.15);
        }

        .card h3 {
            margin: 0 0 0.5rem 0;
            color: var(--amber);
            font-size: 1.25rem;
            transition: color 0.2s ease;
        }

        .card:hover h3 {
            color: var(--red-orange);
        }

        .card p {
            margin: 0;
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.5;
        }
    </style>
</head>

<body>
    <div class="header-container">
        <h1>Interactive Projects</h1>
        <a href="../2026/" class="back-link">← Main Portfolio</a>
    </div>

    <div class="gallery">

        <!-- Pinball Card -->
        <a href="./pinball/index.html" class="card">
            <div>
                <h3>React Pinball</h3>
                <p>Custom 2D arcade pinball game built with React and browser physics.</p>
            </div>
        </a>

        <!-- Motion Landing Page Card -->
        <a href="./animated_landing_page/index.html" class="card">
            <div>
                <h3>Motion Landing Page</h3>
                <p>Interactive 3D space-themed portfolio landing page with physics-driven animations.</p>
            </div>
        </a>

        <!-- Template for Next Project 
        <a href="./future-app/index.html" class="card">
            <div>
                <h3>Next Project</h3>
                <p>Upcoming interactive React app demonstration.</p>
            </div>
        </a>-->

    </div>
</body>

</html>
