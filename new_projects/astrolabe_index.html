<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Projects & Case Studies</title>
    <link rel="icon" href="./favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Tribal/Mystical Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <style>
        :root {
            --cosmic-dark: #0a0510;
            --cosmic-void: #030008;
            --star-glow: #e6dcf5;
            --gold-base: #c5a059;
            --gold-bright: #ffdf8c;
            --gold-shadow: #7a5c24;
            --tribal-accent: #9b2d2a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: var(--cosmic-void);
            font-family: 'Playfair Display', serif;
            color: var(--gold-base);
        }

        /* Deep Space Background */
        .universe-bg {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: 
                radial-gradient(circle at 50% 50%, #150a21 0%, var(--cosmic-void) 80%),
                url('data:image/svg+xml;utf8,<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg"><circle cx="20" cy="20" r="1" fill="rgba(255,255,255,0.2)"/><circle cx="150" cy="80" r="1.5" fill="rgba(255,255,255,0.4)"/><circle cx="80" cy="170" r="0.8" fill="rgba(255,255,255,0.1)"/></svg>');
            background-size: cover, 300px 300px;
            z-index: -2;
            animation: cosmicDrift 120s linear infinite;
        }

        @keyframes cosmicDrift {
            0% { background-position: 0 0, 0 0; }
            100% { background-position: 0 0, 1000px 1000px; }
        }

        /* Large Planet in Background */
        .celestial-body {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120vmin;
            height: 120vmin;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(200, 160, 90, 0.05) 0%, rgba(0,0,0,0) 60%);
            box-shadow: 
                inset 0 0 100px rgba(0,0,0,0.8),
                0 0 150px rgba(150, 100, 50, 0.03);
            border: 1px solid rgba(197, 160, 89, 0.05);
            z-index: -1;
            pointer-events: none;
        }

        /* Layout Container */
        .board-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Header */
        .site-header {
            position: absolute;
            top: 40px;
            left: 40px;
            z-index: 10;
        }
        .site-header h1 {
            font-family: 'Cinzel Decorative', cursive;
            font-size: 2rem;
            color: var(--gold-bright);
            text-shadow: 0 0 20px rgba(197, 160, 89, 0.5);
            letter-spacing: 0.1em;
            margin-bottom: 8px;
        }
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            font-family: 'Cinzel Decorative', cursive;
            color: var(--gold-base);
            text-decoration: none;
            letter-spacing: 0.1em;
            padding: 8px 16px;
            border: 1px solid rgba(197, 160, 89, 0.3);
            background: rgba(10, 5, 16, 0.8);
            backdrop-filter: blur(4px);
            transition: all 0.3s;
        }
        .back-btn:hover {
            color: var(--gold-bright);
            border-color: var(--gold-bright);
            box-shadow: 0 0 15px rgba(197, 160, 89, 0.3);
        }

        /* The Astrolabe Circular Board */
        .astrolabe {
            position: relative;
            width: 70vmin;
            height: 70vmin;
            border-radius: 50%;
            border: 2px dashed rgba(197, 160, 89, 0.2);
            animation: slowSpin 180s linear infinite;
        }

        .astrolabe-inner {
            position: absolute;
            inset: 40px;
            border-radius: 50%;
            border: 1px solid rgba(197, 160, 89, 0.4);
            box-shadow: 0 0 40px rgba(197, 160, 89, 0.05);
            animation: slowSpinReverse 120s linear infinite;
        }

        @keyframes slowSpin {
            100% { transform: rotate(360deg); }
        }
        @keyframes slowSpinReverse {
            100% { transform: rotate(-360deg); }
        }

        /* Center Oracle */
        .oracle-core {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 45vmin;
            height: 45vmin;
            background: radial-gradient(circle at 50% 50%, #150a21 0%, #030008 100%);
            border: 2px solid var(--gold-base);
            border-radius: 50%;
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px;
            box-shadow: 
                0 0 60px rgba(0,0,0,0.9),
                inset 0 0 30px rgba(197, 160, 89, 0.2);
            transition: all 0.5s ease;
        }

        .oracle-core::before {
            content: '';
            position: absolute;
            inset: -10px;
            border-radius: 50%;
            border: 1px solid var(--gold-base);
            opacity: 0.3;
        }

        .oracle-icon {
            font-size: 2.5rem;
            color: var(--gold-bright);
            margin-bottom: 15px;
            filter: drop-shadow(0 0 10px rgba(197, 160, 89, 0.5));
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .oracle-title {
            font-family: 'Cinzel Decorative', cursive;
            font-size: 1.4rem;
            color: var(--gold-bright);
            margin-bottom: 10px;
            letter-spacing: 0.05em;
        }

        .oracle-desc {
            font-size: 0.85rem;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 15px;
            font-style: italic;
        }

        .oracle-fortune {
            font-family: 'Cinzel Decorative', cursive;
            font-size: 0.7rem;
            color: var(--tribal-accent);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            font-weight: 900;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.4s ease;
        }

        .oracle-core.active .oracle-fortune {
            opacity: 1;
            transform: translateY(0);
            text-shadow: 0 0 10px rgba(155, 45, 42, 0.6);
        }

        .oracle-core.active .oracle-icon {
            transform: scale(1.2) rotate(360deg);
        }

        /* Project Nodes */
        .project-node {
            position: absolute;
            width: 60px;
            height: 60px;
            background: var(--cosmic-dark);
            border: 2px solid var(--gold-base);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: var(--gold-base);
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            /* To counteract the parent rotation */
            animation: counterSpin 180s linear infinite;
        }

        @keyframes counterSpin {
            100% { transform: translate(-50%, -50%) rotate(-360deg); }
        }

        .project-node::after {
            content: '';
            position: absolute;
            inset: -6px;
            border-radius: 50%;
            border: 1px solid rgba(197, 160, 89, 0.5);
            transition: all 0.3s;
            opacity: 0;
            transform: scale(0.8);
        }

        .project-node:hover {
            background: var(--gold-base);
            color: var(--cosmic-void);
            box-shadow: 0 0 30px rgba(197, 160, 89, 0.6);
            z-index: 20;
        }

        .project-node:hover::after {
            opacity: 1;
            transform: scale(1);
            border-color: var(--gold-bright);
        }

        /* Zodiac/Tribal Accents */
        .tribal-rune {
            position: absolute;
            font-family: 'Cinzel Decorative', cursive;
            color: rgba(197, 160, 89, 0.15);
            font-size: 1.5rem;
            pointer-events: none;
        }

        @media (max-width: 768px) {
            .site-header { top: 20px; left: 20px; }
            .site-header h1 { font-size: 1.4rem; }
            .astrolabe { width: 90vmin; height: 90vmin; }
            .oracle-core { width: 60vmin; height: 60vmin; padding: 20px; }
            .oracle-title { font-size: 1.1rem; }
            .oracle-desc { font-size: 0.75rem; }
            .project-node { width: 45px; height: 45px; font-size: 1rem; }
        }
    </style>
</head>
<body>

    <div class="universe-bg"></div>
    <div class="celestial-body"></div>

    <header class="site-header">
        <h1>Projects & Case Studies</h1>
        <a href="../2026/" class="back-btn">
            <i class="fa-solid fa-arrow-left"></i> Return to Realm
        </a>
    </header>

    <div class="board-container">
        <!-- The Circular Board -->
        <div class="astrolabe" id="astrolabe">
            <div class="astrolabe-inner"></div>
            <!-- Project nodes will be injected here via JS -->
        </div>

        <!-- The Central Oracle Planchette -->
        <div class="oracle-core" id="oracle">
            <i class="fa-solid fa-eye oracle-icon" id="oracle-icon"></i>
            <div class="oracle-title" id="oracle-title">The Grand Astrolabe</div>
            <div class="oracle-desc" id="oracle-desc">Hover over the cosmic runes to channel knowledge from past realms and projects.</div>
            <div class="oracle-fortune" id="oracle-fortune">Awaiting Channeling...</div>
        </div>
    </div>

    <script>
        const projects = [
            {
                title: "React Pixel Pinball",
                url: "./pinball/index.html",
                icon: "fa-gamepad",
                desc: "Custom 2D physics, game loops & collision detection orchestrated deep inside the React matrix.",
                fortune: "A kinetic energy storm approaches."
            },
            {
                title: "Motion Landing Page",
                url: "./animated_landing_page/index.html",
                icon: "fa-meteor",
                desc: "Procedural starfield, mouse gravity & CSS 3D transforms defying physical space.",
                fortune: "Gravity bends to your will."
            },
            {
                title: "Workout Mixer",
                url: "./workout-shuffler/index.html",
                icon: "fa-heart-pulse",
                desc: "Mobile-first fitness application invoking randomized circuits & drift-free chronomancy.",
                fortune: "Vitality surges through the veins."
            },
            {
                title: "Survival Quiz",
                url: "./survival-quiz/index.html",
                icon: "fa-skull",
                desc: "Psychological CRT shaders, branching state machines & Web Audio drones of the damned.",
                fortune: "Survival is an illusion."
            },
            {
                title: "Chess PyCalc",
                url: "./python-calculator/index.html",
                icon: "fa-chess-knight",
                desc: "PST AI evaluation & live win-probability deltas channeling pure strategic foresight.",
                fortune: "Checkmate was determined eons ago."
            },
            {
                title: "The Wacky Things Store",
                url: "./wacky-things-store/index.html",
                icon: "fa-shop",
                desc: "An educational .NET ecommerce store platform manifesting digital commerce and architecture.",
                fortune: "Wealth flows from the void."
            },
            {
                title: "Zodiac Fortune Board",
                url: "./zodiac-fortune-board/index.html",
                icon: "fa-moon",
                desc: "An interactive Celestial Ouija board that channels unlimited astral power and cosmic rerolls.",
                fortune: "Unlimited power is yours to wield."
            }
        ];

        const astrolabe = document.getElementById('astrolabe');
        const oracle = document.getElementById('oracle');
        const oIcon = document.getElementById('oracle-icon');
        const oTitle = document.getElementById('oracle-title');
        const oDesc = document.getElementById('oracle-desc');
        const oFortune = document.getElementById('oracle-fortune');

        const radius = 50; // percentage based on astrolabe size (50% is edge)
        const totalNodes = projects.length;

        projects.forEach((proj, i) => {
            // Calculate position on the circle
            const angle = (i / totalNodes) * (2 * Math.PI) - (Math.PI / 2); // Start at top
            const x = 50 + (radius * Math.cos(angle));
            const y = 50 + (radius * Math.sin(angle));

            const node = document.createElement('a');
            node.href = proj.url;
            node.className = 'project-node';
            // Position using percentages and translate to center the node on the point
            node.style.left = `${x}%`;
            node.style.top = `${y}%`;
            // The counterSpin animation is added in CSS, but we must set initial transform in keyframes.
            node.style.transform = `translate(-50%, -50%)`; 

            node.innerHTML = `<i class="fa-solid ${proj.icon}"></i>`;

            // Interactions
            node.addEventListener('mouseenter', () => {
                oracle.classList.add('active');
                oIcon.className = `fa-solid ${proj.icon} oracle-icon`;
                oTitle.textContent = proj.title;
                oDesc.textContent = proj.desc;
                oFortune.textContent = proj.fortune;
                oracle.style.boxShadow = '0 0 80px rgba(197, 160, 89, 0.4), inset 0 0 50px rgba(197, 160, 89, 0.4)';
            });

            node.addEventListener('mouseleave', () => {
                oracle.classList.remove('active');
                oracle.style.boxShadow = '0 0 60px rgba(0,0,0,0.9), inset 0 0 30px rgba(197, 160, 89, 0.2)';
            });

            astrolabe.appendChild(node);
        });

        // Add some decorative tribal runes in the background
        const runes = ['ΓÖê','ΓÖë','ΓÖè','ΓÖï','ΓÖî','ΓÖì','ΓÖÄ','ΓÖÅ','ΓÖÉ','ΓÖæ','ΓÖÆ','ΓÖô'];
        for(let i=0; i<12; i++) {
            const angle = (i / 12) * (2 * Math.PI);
            const rNode = document.createElement('div');
            rNode.className = 'tribal-rune';
            rNode.textContent = runes[i];
            
            // Placed slightly inside the main circle
            const rx = 50 + (35 * Math.cos(angle));
            const ry = 50 + (35 * Math.sin(angle));
            
            rNode.style.left = `${rx}%`;
            rNode.style.top = `${ry}%`;
            rNode.style.transform = `translate(-50%, -50%) rotate(${angle + Math.PI/2}rad)`;
            
            astrolabe.appendChild(rNode);
        }
    </script>
</body>
</html>
