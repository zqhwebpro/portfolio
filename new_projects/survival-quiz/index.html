<!-- index.html -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Termalink Protocol - Survival Quiz</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <style>
        :root {
            --term-green: #33ff66;
            --term-green-bright: #66ff8f;
            --term-green-dim: rgba(51, 255, 102, 0.45);
            --term-green-subtle: rgba(51, 255, 102, 0.12);
            --term-bg: #030a05;
            --term-text-main: #e6ffed;
            --term-text-dim: #8affaa;

            /* Bright CRT Monitor Rail Palette */
            --crt-rail-bg: radial-gradient(ellipse at 40% 30%, #0d3816 0%, #08240e 55%, #031407 100%);
            --digital-note-bg: #f5fff7;
            --digital-note-border: #000000;
            --digital-note-ink: #000000;
            --digital-note-sub: #000000;
            --digital-tape-bg: rgba(235, 255, 240, 0.95);
            --digital-tape-border: #000000;
            --start-hue: 0deg;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000;
            font-family: 'Share Tech Mono', monospace;
            color: var(--term-green);
        }

        .crt-screen {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #000;
            transition: filter 0.4s ease;
        }

        .uppercase-label {
            text-transform: uppercase;
        }

        .term-btn {
            background: rgba(3, 15, 6, 0.85);
            color: var(--term-green-bright);
            border: 1.5px solid var(--term-green);
            font-family: 'Share Tech Mono', monospace;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            transition: all 0.12s ease;
            box-shadow: 0 0 8px var(--term-green-subtle);
            text-shadow: 0 0 3px rgba(51, 255, 102, 0.45);
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .term-btn:hover {
            background: var(--term-green);
            color: #011105;
            box-shadow: 0 0 16px var(--term-green);
            text-shadow: none;
        }

        .term-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            background: transparent;
            color: var(--term-green);
        }

        /* --- PIXEL SMILEY BUTTON CIRCLE STYLING --- */
        .pixel-face-btn-circle {
            background: rgba(3, 16, 7, 0.92);
            border: 1.5px solid var(--term-green);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            padding: 0;
            margin: 0;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            outline: none;
            transition: all 0.2s cubic-bezier(0.18, 0.89, 0.32, 1.25);
            box-shadow: 0 0 8px rgba(51, 255, 102, 0.3);
            flex-shrink: 0;
        }

        .pixel-face-btn-circle:hover {
            transform: scale(1.12);
            border-color: var(--term-green-bright);
            box-shadow: 0 0 14px rgba(51, 255, 102, 0.6);
        }

        .pixel-face-btn-circle:active {
            transform: scale(0.92);
        }

        /* --- DIGITAL DISTORTION & CONTINUOUS SLOW PHASE COLOR CYCLE --- */
        @keyframes slowPhaseCycle {
            0% {
                filter: hue-rotate(var(--start-hue, 0deg));
            }
            100% {
                filter: hue-rotate(calc(var(--start-hue, 0deg) + 360deg));
            }
        }

        .crt-screen.color-cycling {
            animation: slowPhaseCycle 24s linear infinite;
        }

        @keyframes digitalGlitchDistort {
            0% {
                transform: translate(0, 0) scale(1);
                filter: hue-rotate(calc(var(--start-hue, 0deg) + 70deg)) contrast(1.6) brightness(1.3);
                clip-path: inset(0 0 0 0);
            }
            15% {
                transform: translate(-7px, 3px) skewX(2.5deg);
                filter: hue-rotate(calc(var(--start-hue, 0deg) + 160deg)) contrast(2.2) brightness(1.7);
                clip-path: polygon(0 12%, 100% 12%, 100% 36%, 0 36%, 0 62%, 100% 62%, 100% 86%, 0 86%);
            }
            30% {
                transform: translate(7px, -4px) skewX(-3deg) scaleY(1.01);
                filter: hue-rotate(calc(var(--start-hue, 0deg) + 260deg)) contrast(2.6) invert(0.12);
                clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
            }
            50% {
                transform: translate(-4px, 2px) skewX(1deg);
                filter: hue-rotate(calc(var(--start-hue, 0deg) + 40deg)) contrast(1.4);
            }
            75% {
                transform: translate(3px, -1px);
                filter: contrast(1.2);
            }
            100% {
                transform: translate(0, 0) scale(1);
                filter: contrast(1);
                clip-path: inset(0 0 0 0);
            }
        }

        .glitch-active {
            animation: digitalGlitchDistort 0.44s ease-out;
        }

        /* --- BRIGHT CRT RAIL (LEFT) --- */
        .archive-rail {
            background: var(--crt-rail-bg);
            position: relative;
            z-index: 50;
            border-right: 2px solid var(--term-green-bright);
            box-shadow: inset -5px 0 25px rgba(51, 255, 102, 0.25), 0 0 15px rgba(51, 255, 102, 0.15);
            overflow-y: auto;
            overflow-x: hidden;
            perspective: 1200px;
        }

        .archive-rail::before {
            content: " ";
            display: block;
            position: absolute;
            inset: 0;
            background: linear-gradient(rgba(10, 45, 18, 0) 50%, rgba(0, 0, 0, 0.38) 50%);
            background-size: 100% 3px;
            pointer-events: none;
            z-index: 10;
        }

        .archive-rail::-webkit-scrollbar {
            width: 8px;
        }

        .archive-rail::-webkit-scrollbar-track {
            background: #021206;
        }

        .archive-rail::-webkit-scrollbar-thumb {
            background: var(--term-green-dim);
            border: 1px solid var(--term-green-bright);
        }

        @keyframes cardFlyIn {
            0% {
                opacity: 0;
                transform: translateY(-26px) scale(0.88);
                filter: brightness(2);
            }

            70% {
                transform: translateY(4px) scale(1.02);
            }

            100% {
                opacity: 1;
                filter: brightness(1);
            }
        }

        .archive-clipping {
            position: relative;
            background: var(--digital-note-bg);
            color: #000000 !important;
            border: 2px solid var(--digital-note-border);
            padding: 18px 16px 14px 16px;
            border-radius: 2px;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.55), 0 0 12px rgba(51, 255, 102, 0.18);
            cursor: pointer;
            transform-style: preserve-3d;
            will-change: transform, box-shadow;
            animation: cardFlyIn 0.5s cubic-bezier(0.18, 0.89, 0.32, 1.25) backwards;
        }

        .archive-clipping:hover {
            box-shadow: 0 18px 36px rgba(0, 0, 0, 0.8), 0 0 28px rgba(51, 255, 102, 0.6);
            z-index: 100 !important;
        }

        .archive-tape {
            position: absolute;
            top: -9px;
            height: 15px;
            background: var(--digital-tape-bg);
            border: 1px dashed var(--digital-tape-border);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
            pointer-events: none;
            z-index: 20;
        }

        .archive-headline {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.98rem;
            font-weight: 800;
            line-height: 1.35;
            color: #000000 !important;
            margin: 4px 0 8px 0;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            border-bottom: 2px solid #000000;
            padding-bottom: 6px;
            transform: translateZ(10px);
        }

        .archive-body {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.88rem;
            line-height: 1.5;
            font-weight: 700;
            color: #000000 !important;
            margin: 0;
            text-align: left;
            display: -webkit-box;
            -webkit-line-clamp: 5;
            -webkit-box-orient: vertical;
            overflow: hidden;
            letter-spacing: -0.01em;
            transform: translateZ(6px);
        }

        /* --- CRT MONITOR DECK (RIGHT) --- */
        .retro-terminal-deck {
            position: relative;
            background: radial-gradient(ellipse at center, #07190b 0%, #030d06 70%, #000401 100%);
            overflow: hidden; /* Prevent scanline from creating any scrollbars */
        }

        .retro-terminal-deck::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.28) 50%);
            z-index: 20;
            background-size: 100% 3px;
            pointer-events: none;
        }

        .retro-terminal-deck::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: radial-gradient(circle, transparent 75%, rgba(0, 0, 0, 0.7) 100%);
            pointer-events: none;
            z-index: 21;
        }

        .scan-bar {
            width: 100%;
            height: 90px;
            background: linear-gradient(0deg, rgba(51, 255, 102, 0) 0%, rgba(51, 255, 102, 0.04) 50%, rgba(51, 255, 102, 0) 100%);
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 22;
            animation: scanLine 8s linear infinite;
        }

        @keyframes scanLine {
            0% {
                transform: translateY(-100px);
            }

            100% {
                transform: translateY(100vh);
            }
        }

        /* --- 80's DIGITAL RETRO COMPUTER PAGE TRANSITION --- */
        @keyframes retro80sPageAnim {
            0% {
                opacity: 0.05;
                transform: translateY(-8px);
                filter: brightness(2.6) contrast(1.5) drop-shadow(0 0 16px var(--term-green-bright));
                clip-path: inset(0 0 95% 0);
            }
            25% {
                opacity: 0.7;
                clip-path: inset(0 0 60% 0);
                filter: brightness(2.0) contrast(1.3);
            }
            50% {
                opacity: 0.9;
                clip-path: inset(0 0 25% 0);
                filter: brightness(1.5) contrast(1.15);
            }
            75% {
                opacity: 0.98;
                clip-path: inset(0 0 0 0);
                filter: brightness(1.15);
                transform: translateY(0);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
                filter: brightness(1);
                clip-path: inset(0 0 0 0);
            }
        }

        .retro-80s-page-anim {
            animation: retro80sPageAnim 0.34s cubic-bezier(0.1, 0.9, 0.2, 1) both;
            position: relative;
        }

        @keyframes rasterSweepLine {
            0% { top: 0%; opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        .raster-sweep-line {
            position: absolute;
            left: 0;
            right: 0;
            height: 4px;
            background: #ffffff;
            box-shadow: 0 0 10px #ffffff, 0 0 20px var(--term-green-bright);
            pointer-events: none;
            z-index: 50;
            animation: rasterSweepLine 0.34s ease-out forwards;
        }

        .scroll-dark::-webkit-scrollbar {
            width: 7px;
        }

        .scroll-dark::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.6);
        }

        .scroll-dark::-webkit-scrollbar-thumb {
            background: var(--term-green-dim);
        }

        .scroll-dark::-webkit-scrollbar-thumb:hover {
            background: var(--term-green);
        }

        .dossier-animate {
            position: relative;
            z-index: 25;
            animation: fadeIn 0.4s ease-out both;
        }

        .modal-backdrop {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(1, 8, 3, 0.84);
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
            padding: 24px;
        }

        .modal-box-crt {
            position: relative;
            width: 100%;
            max-width: 680px;
            padding: 28px 32px;
            background: radial-gradient(ellipse at center, #08210d 0%, #030f06 70%, #010803 100%);
            border: 1.5px solid var(--term-green-bright);
            box-shadow: 0 0 35px rgba(51, 255, 102, 0.25), inset 0 0 20px rgba(51, 255, 102, 0.08);
            font-family: 'Share Tech Mono', monospace;
            color: var(--term-text-main);
            transform-origin: center center;
            animation: crtZoomIn 0.28s cubic-bezier(0.12, 0.9, 0.24, 1.25) forwards;
            overflow: hidden;
        }

        .modal-box-crt::before {
            content: " ";
            display: block;
            position: absolute;
            inset: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.32) 50%);
            background-size: 100% 3px;
            pointer-events: none;
            z-index: 10;
        }

        @keyframes crtZoomIn {
            0% {
                opacity: 0;
                transform: scale(0.04) rotateX(15deg);
                filter: brightness(2.5);
            }

            70% {
                transform: scale(1.03);
                filter: brightness(1.2);
            }

            100% {
                opacity: 1;
                transform: scale(1) rotateX(0deg);
                filter: brightness(1);
            }
        }

        /* --- QUIZ & TERMINAL ASSESSMENT STYLING --- */
        .quiz-option-btn {
            background: rgba(3, 18, 7, 0.85);
            color: var(--term-text-main);
            border: 1.5px solid var(--term-green-dim);
            font-family: 'Share Tech Mono', monospace;
            padding: 12px 16px;
            cursor: pointer;
            text-align: left;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            transition: all 0.15s ease;
            position: relative;
            border-radius: 2px;
            line-height: 1.45;
            font-size: 0.98rem;
            width: 100%;
        }

        .quiz-option-btn:hover {
            background: rgba(51, 255, 102, 0.12);
            border-color: var(--term-green-bright);
            box-shadow: 0 0 14px rgba(51, 255, 102, 0.25);
            transform: translateX(4px);
        }

        .quiz-option-btn.selected {
            background: rgba(51, 255, 102, 0.22);
            border-color: var(--term-green-bright);
            color: #fff;
            box-shadow: 0 0 18px rgba(51, 255, 102, 0.4), inset 0 0 10px rgba(51, 255, 102, 0.15);
            font-weight: 700;
        }

        .quiz-badge {
            background: var(--term-green);
            color: #011105;
            font-weight: 900;
            padding: 2px 7px;
            font-size: 0.82rem;
            border-radius: 2px;
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 28px;
        }

        .quiz-option-btn.selected .quiz-badge {
            background: var(--term-green-bright);
            box-shadow: 0 0 8px var(--term-green-bright);
        }

        .step-dot {
            width: 28px;
            height: 28px;
            border: 1.5px solid var(--term-green-dim);
            background: rgba(0, 20, 5, 0.7);
            color: var(--term-green-dim);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.82rem;
            font-weight: 700;
            border-radius: 2px;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .step-dot.active {
            border-color: var(--term-green-bright);
            background: rgba(51, 255, 102, 0.25);
            color: var(--term-green-bright);
            box-shadow: 0 0 12px var(--term-green-bright);
            transform: scale(1.1);
        }

        .step-dot.answered {
            border-color: var(--term-green);
            color: var(--term-green);
            background: rgba(51, 255, 102, 0.1);
        }

        /* --- LOSER SCREEN STYLING --- */
        .loser-container {
            border: 2px solid #ff3344;
            background: radial-gradient(ellipse at center, rgba(60, 5, 10, 0.85) 0%, rgba(25, 2, 4, 0.95) 100%);
            box-shadow: 0 0 35px rgba(255, 51, 68, 0.4), inset 0 0 25px rgba(255, 51, 68, 0.15);
            padding: 24px 28px;
            position: relative;
            animation: loserPulse 1.8s infinite alternate;
        }

        @keyframes loserPulse {
            0% { box-shadow: 0 0 25px rgba(255, 51, 68, 0.35); }
            100% { box-shadow: 0 0 45px rgba(255, 51, 68, 0.7); }
        }

        .loser-btn {
            background: rgba(50, 6, 12, 0.9);
            color: #ff6677;
            border: 1.5px solid #ff3344;
            font-family: 'Share Tech Mono', monospace;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            padding: 10px 24px;
            font-weight: 700;
            transition: all 0.15s ease;
            box-shadow: 0 0 10px rgba(255, 51, 68, 0.3);
        }

        .loser-btn:hover {
            background: #ff3344;
            color: #000;
            box-shadow: 0 0 22px #ff3344;
        }

        /* --- SUCCESS SCREEN STYLING --- */
        .victory-container {
            border: 2px solid var(--term-green-bright);
            background: radial-gradient(ellipse at center, rgba(8, 45, 16, 0.85) 0%, rgba(2, 20, 7, 0.95) 100%);
            box-shadow: 0 0 45px rgba(51, 255, 102, 0.5), inset 0 0 30px rgba(51, 255, 102, 0.2);
            padding: 28px 32px;
            position: relative;
            animation: victoryGlow 2s infinite alternate;
        }

        @keyframes victoryGlow {
            0% { box-shadow: 0 0 30px rgba(51, 255, 102, 0.4); }
            100% { box-shadow: 0 0 55px rgba(102, 255, 143, 0.85); }
        }

        /* Canvas Confetti Layer */
        .confetti-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
        }
    </style>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body>
    <div id="root"></div>
    <script type="text/babel" src="./App.js?v=10.000"></script>
    <script type="text/babel" src="./index.js?v=10.000"></script>
</body>

</html>
