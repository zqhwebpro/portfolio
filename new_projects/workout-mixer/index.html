<!-- index.html -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />

    <!-- Updated SEO & Meta Tags -->
    <title>Zach Heindel | Workout Mixer — Mobile-First Fitness Circuit Generator & Drift-Free Timers</title>
    <meta name="title" content="Zach Heindel | Workout Mixer — Mobile-First Fitness Circuit Generator & Drift-Free Timers" />
    <meta name="description"
        content="Generate randomized, balanced gym routines with target muscle isolation, instructional motion previews, and drift-free Web Audio interval timers." />
    <meta name="keywords"
        content="Workout Mixer, workout generator, fitness visualizer, gym routines, exercise form guide, random workout, JavaScript timer, Zach Heindel" />
    <meta name="author" content="Zach Heindel" />
    <link rel="icon" href="./favicon.png" type="image/png" />
    <meta name="theme-color" content="#1d4ed8" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Workout Mixer — Mobile-First Fitness Circuit Generator & Drift-Free Timers" />
    <meta property="og:description"
        content="Generate randomized, balanced gym routines with target muscle isolation, instructional motion previews, and drift-free Web Audio interval timers." />
    <meta property="og:url" content="https://heindel.org/new_projects/workout-mixer/" />
    <meta property="og:site_name" content="ZQH.WEBPRO" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="Workout Mixer — Mobile-First Fitness Circuit Generator" />
    <meta property="twitter:description"
        content="Generate randomized, balanced gym routines with target muscle isolation, instructional motion previews, and drift-free Web Audio interval timers." />

    <!-- JSON-LD AI SEO Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Workout Mixer",
      "applicationCategory": "HealthApplication",
      "operatingSystem": "Web Browser",
      "description": "Mobile-first fitness application with randomized workout circuit generators, anatomical muscle mapping, and drift-free interval timers.",
      "url": "https://heindel.org/new_projects/workout-mixer/",
      "author": {
        "@type": "Person",
        "name": "Zach Heindel"
      },
      "programmingLanguage": ["JavaScript", "HTML5", "CSS3", "Tailwind CSS"]
    }
    </script>

    <!-- Google Fonts: Poppins, Graduate & Teko for athletic brand typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Graduate&family=Poppins:ital,wght@0,500;0,600;0,700;0,800;0,900;1,700;1,800&family=Teko:wght@700&display=swap"
        rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Poppins', '-apple-system', 'sans-serif'],
                        varsity: ['Graduate', 'Arial Black', 'Impact', 'sans-serif']
                    },
                    colors: {
                        pf: {
                            blue: '#1d4ed8',         /* Signature Royal Blue */
                            darkblue: '#1e40af',     /* Deep Navy Accent */
                            blackblue: '#0f172a',    /* Dark Slate / Contrast Header */
                            yellow: '#ffb81c',       /* High-Voltage Accent Yellow */
                            lightyellow: '#ffe396',
                            canvas: '#f1f5f9',       /* Clean Slate Light Neutral */
                            surface: '#ffffff',      /* Crisp White Surface */
                            border: '#cbd5e1',       /* Slate Border */
                            slate: '#475569',
                            charcoal: '#0f172a'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            overflow-x: hidden;
            background-color: #f1f5f9;
            color: #0f172a;
            font-family: 'Poppins', -apple-system, sans-serif;
        }

        /* High-Energy Gym Cards */
        .pf-card {
            background: #ffffff;
            border: 2px solid #e2e8f0;
            border-radius: 1.25rem;
            box-shadow: 0 4px 16px -2px rgba(29, 78, 216, 0.08);
        }

        .pf-panel {
            background: #f8fafc;
            border: 1.5px solid #e2e8f0;
            border-radius: 1rem;
        }

        /* Yellow Pill Button */
        .btn-pf-yellow {
            background-color: #ffb81c;
            color: #0f172a;
            font-weight: 800;
            border-radius: 9999px;
            box-shadow: 0 4px 12px rgba(255, 184, 28, 0.35);
            transition: all 0.15s ease;
            user-select: none;
        }

        .btn-pf-yellow:hover:not(:disabled) {
            background-color: #f5ab0c;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(255, 184, 28, 0.45);
        }

        .btn-pf-yellow:active:not(:disabled) {
            transform: scale(0.97);
        }

        /* Royal Blue Pill Button */
        .btn-pf-blue {
            background-color: #1d4ed8;
            color: #ffffff;
            font-weight: 700;
            border-radius: 9999px;
            box-shadow: 0 4px 14px rgba(29, 78, 216, 0.25);
            transition: all 0.15s ease;
            user-select: none;
        }

        .btn-pf-blue:hover:not(:disabled) {
            background-color: #1e40af;
            transform: translateY(-1px);
        }

        .btn-pf-blue:active:not(:disabled) {
            transform: scale(0.97);
        }

        @keyframes marquee {
            0% {
                transform: translateX(0%);
            }

            100% {
                transform: translateX(-50%);
            }
        }

        .animate-marquee {
            display: inline-block;
            white-space: nowrap;
            animation: marquee var(--marquee-speed, 35s) linear infinite;
        }

        .animate-marquee:hover {
            animation-play-state: paused;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #e2e8f0;
            border-radius: 6px;
        }

        ::-webkit-scrollbar-thumb {
            background: #1d4ed8;
            border-radius: 6px;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>

    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel" src="./App.js?v=6.000"></script>
    <script type="text/babel" src="./index.js?v=6.000"></script>
</body>

</html>
