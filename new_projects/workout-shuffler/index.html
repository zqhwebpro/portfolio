<!-- index.html -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />

    <title>WO Randomizer - Athletic Routine Engine</title>
    <meta name="description" content="Generate balanced, randomized routines with cadence feeds and form guides." />

    <!-- Google Fonts: Poppins (Clean, approachable, athletic gym look) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,500;0,600;0,700;0,800;0,900;1,700;1,800&display=swap"
        rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Poppins', '-apple-system', 'sans-serif'],
                    },
                    colors: {
                        pf: {
                            blue: '#1d4ed8',         /* Signature Royal Blue */
                            darkblue: '#1e40af',     /* Deep Navy Accent */
                            blackblue: '#0f172a',    /* Dark Slate / Contrast Header */
                            yellow: '#ffb81c',       /* High-Voltage Accent Yellow */
                            lightyellow: '#ffe396',
                            canvas: '#f1f5f9',       /* Clean Slate Light Neutral */
                            surface: '#ffffff',      /* Crisp White Surface */
                            border: '#cbd5e1',       /* Slate Border */
                            slate: '#475569',
                            charcoal: '#0f172a'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            overflow-x: hidden;
            background-color: #f1f5f9;
            color: #0f172a;
            font-family: 'Poppins', -apple-system, sans-serif;
        }

        /* High-Energy Gym Cards */
        .pf-card {
            background: #ffffff;
            border: 2px solid #e2e8f0;
            border-radius: 1.25rem;
            box-shadow: 0 4px 16px -2px rgba(29, 78, 216, 0.08);
        }

        .pf-panel {
            background: #f8fafc;
            border: 1.5px solid #e2e8f0;
            border-radius: 1rem;
        }

        /* Yellow Pill Button */
        .btn-pf-yellow {
            background-color: #ffb81c;
            color: #0f172a;
            font-weight: 800;
            border-radius: 9999px;
            box-shadow: 0 4px 12px rgba(255, 184, 28, 0.35);
            transition: all 0.15s ease;
            user-select: none;
        }

        .btn-pf-yellow:hover:not(:disabled) {
            background-color: #f5ab0c;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(255, 184, 28, 0.45);
        }

        .btn-pf-yellow:active:not(:disabled) {
            transform: scale(0.97);
        }

        /* Royal Blue Pill Button */
        .btn-pf-blue {
            background-color: #1d4ed8;
            color: #ffffff;
            font-weight: 700;
            border-radius: 9999px;
            box-shadow: 0 4px 14px rgba(29, 78, 216, 0.25);
            transition: all 0.15s ease;
            user-select: none;
        }

        .btn-pf-blue:hover:not(:disabled) {
            background-color: #1e40af;
            transform: translateY(-1px);
        }

        .btn-pf-blue:active:not(:disabled) {
            transform: scale(0.97);
        }

        @keyframes marquee {
            0% {
                transform: translateX(0%);
            }

            100% {
                transform: translateX(-50%);
            }
        }

        .animate-marquee {
            display: inline-block;
            white-space: nowrap;
            animation: marquee 32s linear infinite;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #e2e8f0;
            border-radius: 6px;
        }

        ::-webkit-scrollbar-thumb {
            background: #1d4ed8;
            border-radius: 6px;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>

    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel" src="./App.js?v=5.100"></script>
    <script type="text/babel" src="./index.js?v=5.100"></script>
</body>

</html>
