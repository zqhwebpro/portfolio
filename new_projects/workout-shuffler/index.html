<!-- index.html -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />

    <title>WO Randomizer - Athletic Routine Engine</title>
    <meta name="description"
        content="Intelligent athletic workout generator with form cues, motion feed, and exercise tutorials." />

    <!-- Google Fonts: Inter & Barlow Condensed (Modern Athletic Pro Feel) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        athletic: ['"Barlow Condensed"', 'sans-serif'],
                        sans: ['Inter', '-apple-system', 'sans-serif']
                    },
                    colors: {
                        'base-dark': '#0a0e17',
                        'card-dark': '#111827',
                        'panel-dark': '#151f32',
                        'panel-hover': '#1e2b45',
                        'border-steel': '#26354f',
                        'accent-blue': '#0284c7',
                        'electric-sky': '#38bdf8',
                        'glow-cyan': '#00f0ff'
                    }
                }
            }
        }
    </script>

    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            overflow-x: hidden;
            background-color: #0a0e17;
            background-image:
                radial-gradient(ellipse at 50% 0%, rgba(14, 116, 144, 0.15) 0%, transparent 60%),
                radial-gradient(circle at 100% 100%, rgba(2, 132, 199, 0.08) 0%, transparent 50%);
            color: #f1f5f9;
            font-family: 'Inter', sans-serif;
        }

        /* Athletic Steel Panels */
        .steel-panel {
            background: linear-gradient(180deg, #131d2e 0%, #0d1522 100%);
            border: 1px solid #22324d;
            border-top: 1px solid #334b73;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
            border-radius: 0.75rem;
        }

        .steel-card {
            background: #111a29;
            border: 1px solid #22324d;
            border-radius: 0.625rem;
        }

        /* Buttons */
        .btn-action-primary {
            background: linear-gradient(180deg, #0284c7 0%, #0369a1 100%);
            color: #ffffff;
            border: 1px solid #38bdf8;
            box-shadow: 0 2px 8px rgba(2, 132, 199, 0.35);
            transition: all 0.15s ease;
        }

        .btn-action-primary:hover:not(:disabled) {
            background: linear-gradient(180deg, #0ea5e9 0%, #0284c7 100%);
            box-shadow: 0 0 14px rgba(56, 189, 248, 0.5);
            transform: translateY(-1px);
        }

        .btn-steel {
            background: #162030;
            border: 1px solid #2a3d5e;
            color: #94a3b8;
            transition: all 0.15s ease;
        }

        .btn-steel:hover:not(:disabled) {
            background: #1e2c44;
            border-color: #38bdf8;
            color: #f1f5f9;
        }

        @keyframes marquee {
            0% {
                transform: translateX(0%);
            }

            100% {
                transform: translateX(-50%);
            }
        }

        .animate-marquee {
            display: inline-block;
            white-space: nowrap;
            animation: marquee 30s linear infinite;
        }

        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }

        ::-webkit-scrollbar-track {
            background: #0a0e17;
        }

        ::-webkit-scrollbar-thumb {
            background: #22324d;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #0284c7;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>

    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel" src="./App.js?v=4.000"></script>
    <script type="text/babel" src="./index.js?v=4.000"></script>
</body>

</html>
