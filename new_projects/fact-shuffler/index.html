<!-- index.html -->
<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>The Price is Trivia!</title>

    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Bootstrap Icons CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Retro Game Show Google Fonts (Price is Right vibes) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Shrikhand&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --pir-yellow: #ffe600;
            --pir-orange: #ff7700;
            --pir-magenta: #ff0077;
            --pir-cyan: #00e5ff;
            --pir-green: #00ff66;
            --pir-navy: #0e072b;
            --pir-card-bg: #190e3d;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at 50% 20%, #2f1266 0%, #160838 50%, #080216 100%);
            color: #ffffff;
            overflow: hidden;
        }

        .show-font {
            font-family: 'Shrikhand', cursive;
            letter-spacing: 0.04em;
        }

        /* Marquee Header with Stage Bulb Border */
        .marquee-bar {
            background: linear-gradient(180deg, #3d1480 0%, #1c0845 100%);
            border-bottom: 4px solid var(--pir-yellow);
            box-shadow: 0 4px 25px rgba(255, 230, 0, 0.35);
        }

        /* Retro Contestant Pod Card */
        .contestant-card {
            background: rgba(25, 14, 61, 0.85);
            border: 2px solid rgba(255, 255, 255, 0.14);
            border-radius: 14px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
            transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .contestant-card:hover {
            transform: translateY(-2px);
            border-color: var(--pir-yellow);
            box-shadow: 0 0 16px rgba(255, 230, 0, 0.3);
        }

        /* Hot Seat Stage Podium */
        .stage-podium {
            background: radial-gradient(circle at 50% 30%, #3a1577 0%, #1a083d 100%);
            border: 3px solid var(--pir-yellow);
            border-radius: 20px;
            box-shadow: 0 0 25px rgba(255, 230, 0, 0.25), inset 0 0 20px rgba(255, 119, 0, 0.2);
        }

        /* Big Red Big Wheel Buzzer */
        .pir-buzzer {
            background: linear-gradient(180deg, #ff2a2a 0%, #bd0000 100%);
            border: 3px solid #ffb3b3;
            color: #ffffff;
            font-family: 'Shrikhand', cursive;
            letter-spacing: 0.05em;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
            box-shadow: 0 6px 0 #700000, 0 10px 22px rgba(255, 42, 42, 0.45);
            transition: all 0.1s ease;
        }

        .pir-buzzer:hover {
            color: #fff;
            filter: brightness(1.1);
        }

        .pir-buzzer:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #700000, 0 4px 10px rgba(255, 42, 42, 0.45);
        }

        /* Contestant Score Display */
        .score-board {
            background: #060213;
            border: 2px solid var(--pir-cyan);
            border-radius: 12px;
            box-shadow: inset 0 0 10px rgba(0, 229, 255, 0.4), 0 0 12px rgba(0, 229, 255, 0.3);
            font-family: 'Shrikhand', cursive;
        }

        /* Category Filter Buttons */
        .pill-toggle {
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            border-width: 2px !important;
        }

        .custom-scroll::-webkit-scrollbar {
            width: 7px;
        }

        .custom-scroll::-webkit-scrollbar-track {
            background: transparent;
        }

        .custom-scroll::-webkit-scrollbar-thumb {
            background: var(--pir-orange);
            border-radius: 8px;
        }
    </style>

    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</head>

<body class="p-2 p-md-3 vh-100 vw-100 d-flex flex-column">
    <div id="root"
        class="h-100 w-100 rounded-4 overflow-hidden border border-warning border-opacity-75 shadow-lg d-flex flex-column"
        style="background-color: #0b041a;"></div>
    <script type="text/babel" src="./App.js"></script>
    <script type="text/babel" src="./index.js"></script>
</body>

</html>
