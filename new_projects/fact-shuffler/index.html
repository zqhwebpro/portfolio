<!-- index.html -->
<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Trivia Showdown</title>

    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Bootstrap Icons CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Retro Game Show Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bungee&family=Chongo&family=Outfit:wght@400;600;700;800;900&display=swap"
        rel="stylesheet">

    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at 50% 10%, #200f4f 0%, #0d0722 55%, #05020c 100%);
            color: #ffffff;
            overflow: hidden;
        }

        .show-font {
            font-family: 'Bungee', cursive;
            letter-spacing: 0.05em;
        }

        /* Studio Spotlight Bar */
        .stage-header {
            background: linear-gradient(180deg, #1f104d 0%, #11072e 100%);
            border-bottom: 3px solid #ffcc00;
            box-shadow: 0 4px 30px rgba(255, 204, 0, 0.25);
        }

        /* Neon Contestant Pod / Card */
        .game-card {
            background: rgba(26, 15, 61, 0.75);
            border: 2px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .game-card:hover {
            border-color: #00f0ff;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.35);
            transform: scale(1.015);
        }

        /* Studio Hot Seat Arena */
        .hot-seat {
            background: linear-gradient(145deg, #1b0c45 0%, #2c0e5a 100%);
            border: 3px solid #ff0077;
            box-shadow: 0 0 35px rgba(255, 0, 119, 0.3);
            border-radius: 20px;
        }

        /* Glowing Buzzer Button */
        .buzzer-btn {
            background: linear-gradient(180deg, #ff0055 0%, #b3003b 100%);
            border: 2px solid #ff99bb;
            color: white;
            font-family: 'Bungee', cursive;
            letter-spacing: 0.08em;
            box-shadow: 0 6px 0 #730026, 0 10px 20px rgba(255, 0, 85, 0.4);
            transition: all 0.1s ease;
        }

        .buzzer-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #730026, 0 4px 10px rgba(255, 0, 85, 0.4);
        }

        /* Scoreboard Display */
        .led-display {
            background: #080314;
            border: 2px solid #ffcc00;
            box-shadow: inset 0 0 12px rgba(255, 204, 0, 0.3), 0 0 15px rgba(255, 204, 0, 0.2);
            border-radius: 10px;
            font-family: 'Bungee', monospace;
        }

        /* Neon Toggles */
        .pill-toggle {
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-width: 2px !important;
            transition: all 0.15s ease;
        }

        /* Custom Scrollbar */
        .custom-scroll::-webkit-scrollbar {
            width: 8px;
        }

        .custom-scroll::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
        }

        .custom-scroll::-webkit-scrollbar-thumb {
            background: #ff0077;
            border-radius: 10px;
        }
    </style>

    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</head>

<body class="p-2 p-md-3 vh-100 vw-100 d-flex flex-column">
    <div id="root"
        class="h-100 w-100 rounded-4 overflow-hidden border border-warning border-opacity-50 shadow-lg d-flex flex-column"
        style="background-color: #0d0722;"></div>
    <script type="text/babel" src="./App.jsx"></script>
    <script type="text/babel" src="./index.js"></script>
</body>

</html>
